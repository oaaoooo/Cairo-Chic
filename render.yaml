# One-click deploy on Render.com (free plan)
services:
  - type: web
    name: cairo-chic
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        sync: false # paste your Neon Postgres connection string in Render dashboard
      - key: SESSION_SECRET
        generateValue: true
