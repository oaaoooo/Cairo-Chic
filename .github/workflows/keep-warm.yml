name: Keep store warm

# Free keep-alive pings (public repo = unlimited Actions minutes).
# Hits the storefront API every 5 minutes so the Worker isolate and
# the Neon database stay warm and first visits stay fast.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping storefront API
        run: |
          curl -fsS -o /dev/null -w 'bootstrap %{http_code} %{time_total}s\n' https://cairo-chic.eg-shop.workers.dev/api/bootstrap
