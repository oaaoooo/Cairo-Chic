name: Keep store warm

# Free keep-alive pings (public repo = unlimited Actions minutes).
# Hits the storefront API every 15 minutes. NOTE: do NOT ping more often -
# Neon Free allows 100 CU-hours/month and over-pinging can exhaust it and
# suspend the database. 15min keeps usage safely under the cap.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping storefront API
        run: |
          curl -fsS -o /dev/null -w 'bootstrap %{http_code} %{time_total}s\n' https://cairo-chic.eg-shop.workers.dev/api/bootstrap
