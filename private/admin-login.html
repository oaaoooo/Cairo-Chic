<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>دخول لوحة التحكم | كايرو شيك</title>
<link rel="icon" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .admin-login-wrap { max-width: 430px; margin: 80px auto; padding: 0 16px; }
  .login-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 24px rgba(0,0,0,.1); text-align: center; }
  .login-card img { width: 70px; height: 70px; object-fit: cover; }
  .login-card label { display: block; text-align: right; font-weight: 700; margin-top: 18px; }
  .login-card input { width: 100%; padding: 13px; border: 2px solid #ddd; border-radius: 10px; font-family: inherit; font-size: 16px; margin: 6px 0 12px; }
  .login-card button { width: 100%; }
  .login-card a { display: inline-block; margin-top: 16px; color: inherit; }
  @media (max-width: 700px) { .admin-login-wrap { margin: 40px auto; } .login-card { padding: 22px 18px; } }
</style>
<script src="/js/admin-login.js" defer></script>
</head>
<body>
<main class="admin-login-wrap">
  <div class="login-card">
    <img src="/images/logo.jpg" class="logo" alt="كايرو شيك">
    <h1>دخول لوحة التحكم 🦅</h1>
    <p class="muted">اللوحة متاحة لصاحب المتجر بعد تسجيل الدخول.</p>
    <form id="loginForm" method="post" action="/api/admin/login">
      <noscript><p class="form-error">فعّل جافاسكريبت عشان تقدر تسجّل الدخول.</p></noscript>
      <label for="adminPass">كلمة المرور</label>
      <input type="password" id="adminPass" name="password" autocomplete="current-password" required>
      <div class="form-error" id="loginError" role="alert" aria-live="polite"></div>
      <button class="btn btn-primary btn-big" id="loginBtn" type="submit">دخول</button>
    </form>
    <a href="/">الرجوع للمتجر</a>
  </div>
</main>
</body>
</html>
